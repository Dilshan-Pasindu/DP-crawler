name: Phase 0 Windows Compile and Smoke Check

on:
  workflow_dispatch:

jobs:
  windows-flaui-poc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore and Build FlaUI PoC
        run: dotnet build poc/windows-flaui/WindowsHelperPoc.csproj -c Release
      - name: Run Non-Interactive Smoke Check
        run: dotnet run --project poc/windows-flaui/WindowsHelperPoc.csproj -c Release --no-build
